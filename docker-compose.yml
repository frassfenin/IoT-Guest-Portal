version: '3.8'

services:
  gastportal:
    build: .
    container_name: gastportal
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=8085
    volumes:
      # Persist configs, setup credentials, matter fabric keys, and operational cache
      - ./server/data:/app/server/data
